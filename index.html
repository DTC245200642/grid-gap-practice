<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gap Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Ví dụ 1: grid-gap: 20px (Khoảng cách hàng và cột đều nhau)</h2>
    <div class="grid-container example1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: gap: 30px 10px (Khoảng cách hàng 30px, cột 10px)</h2>
    <div class="grid-container example2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>
</body>
</html>
